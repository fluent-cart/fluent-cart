actor: IntegrationTester
# Removes rows that code under test committed, so they do not leak into later tests.
extensions:
  enabled:
    - Tests\Support\Extension\HealCommittedRowsExtension
bootstrap: _bootstrap.php
modules:
  enabled:
    - lucatume\WPBrowser\Module\WPLoader
  config:
    lucatume\WPBrowser\Module\WPLoader:
      wpRootFolder: "%WORDPRESS_ROOT_DIR%"
      dbName: '%TEST_DB_NAME%'
      dbHost: '%TEST_DB_HOST%'
      dbUser: '%TEST_DB_USER%'
      dbPassword: '%TEST_DB_PASSWORD%'
      wpDebug: true
      tablePrefix: '%TEST_TABLE_PREFIX%'
      domain: '%WORDPRESS_DOMAIN%'
      adminEmail: 'admin@%WORDPRESS_DOMAIN%'
      title: 'FluentCart Integration Tests'
      plugins:
        - '%FLUENT_CART%/fluent-cart.php'
      theme: ''
      loadOnly: false
